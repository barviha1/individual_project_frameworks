{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HRDocs{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body class="d-flex flex-column">
    <header class="site-header">
        <div class="container d-flex align-items-center flex-wrap">
            <a href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt="HRDocs"
                    class="hrdocs-logo"
                >
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container flex-grow-1 py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer container mt-4 mb-3">
        <p class="mb-0">
            © <span id="current-year"></span> HRDocs
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
